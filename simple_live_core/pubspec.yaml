publish_to: "none"
environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies: 
  dio: ^5.5.0+1
  logger: ^2.4.0
  web_socket_channel: ^3.0.1
  html_unescape: ^2.0.0
  protobuf: ^3.1.0
  crypto: ^3.0.3
  pointycastle: ^4.0.0
  brotli: ^0.6.0
  tars_dart:
    path: ./packages/tars_dart
  fixnum: ^1.1.0
  dart_quickjs:
    path: ../third_party/dart_quickjs_compat
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

dev_dependencies: 
  lints: ^2.0.0
  test: 1.25.8

dependency_overrides:
  meta: 1.14.0

