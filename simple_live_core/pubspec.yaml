name: simple_live_core
version: 1.0.3
description: "聚合直播核心库"
repository: https://github.com/xuanxuan123xuan/dart_simple_live
publish_to: "none"
environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies: 
  dio: ^5.5.0+1
  logger: ^2.4.0
  web_socket_channel: ^3.0.1
  html_unescape: ^2.0.0
  protobuf: ^3.1.0
  crypto: ^3.0.3
  pointycastle: ^4.0.0
  brotli: ^0.6.0
  tars_dart:
    path: ./packages/tars_dart
  fixnum: ^1.1.0
  # git 源为纯 Dart（ffi/native_toolchain_c，无 Flutter SDK 依赖），
  # 保证 simple_live_core 可在纯 Dart 环境解析并跑单测。
  # 鸿蒙构建由 simple_live_app 的 dependency_overrides 覆盖为
  # third_party/dart_quickjs_compat（OHOS 3.22 工具链无法消费 Native Assets）。
  dart_quickjs:
    git:
      url: https://github.com/xiaoyaocz/dart_quickjs
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

dev_dependencies: 
  lints: ^2.0.0
  test: 1.25.8

dependency_overrides:
  meta: 1.14.0
  # 单测环境（纯 Dart、无 C 工具链）用 stub 替代 git 源的 native assets 实现，
  # 避免 dart test 触发 build hooks 编译 QuickJS。该 override 只影响
  # simple_live_core 自身解析，不跨包传播；app 构建仍由
  # simple_live_app 的 dependency_overrides 覆盖为 dart_quickjs_compat。
  dart_quickjs:
    path: ../third_party/dart_quickjs_stub

