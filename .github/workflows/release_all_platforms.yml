name: 全平台构建并发布 Release

run-name: >-
  Release ${{ inputs.version || 'version from pubspec' }}
  (${{ github.event_name }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "可选构建版本号（如 1.13 或 1.13.1）；只在 runner 临时生效，不提交源码分支"
        required: false
        type: string
      publish_release:
        description: "构建完成后创建或更新 GitHub Release"
        required: true
        type: boolean
        default: true
      prerelease:
        description: "标记为预发布版本"
        required: true
        type: boolean
        default: false
      signed_ios:
        description: "生成已签名 IPA（需要 iOS 签名 secrets）"
        required: true
        type: boolean
        default: false
      include_ohos:
        description: "使用自建 harmonyos runner 生成已签名 HAP"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-all-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.41.x"
  TV_FLUTTER_VERSION: "3.41.x"
  XCODE_VERSION: "15.4"
  IOS_XCODE_VERSION: "26.0"
  FASTFORGE_VERSION: "0.6.10"

jobs:
  prepare:
    name: 校验并解析发布版本
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      full_version: ${{ steps.release.outputs.full_version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      publish_release: ${{ steps.settings.outputs.publish_release }}
      prerelease: ${{ steps.settings.outputs.prerelease }}
      signed_ios: ${{ steps.settings.outputs.signed_ios }}
      include_ohos: ${{ steps.settings.outputs.include_ohos }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析工作流设置
        id: settings
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_SIGNED_IOS: ${{ inputs.signed_ios }}
          INPUT_INCLUDE_OHOS: ${{ inputs.include_ohos }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            publish_release="${INPUT_PUBLISH_RELEASE:-true}"
            prerelease="${INPUT_PRERELEASE:-false}"
            signed_ios="${INPUT_SIGNED_IOS:-false}"
            include_ohos="${INPUT_INCLUDE_OHOS:-true}"
          else
            publish_release=true
            prerelease=false
            signed_ios=false
            include_ohos=true
          fi
          {
            echo "publish_release=$publish_release"
            echo "prerelease=$prerelease"
            echo "signed_ios=$signed_ios"
            echo "include_ohos=$include_ohos"
          } >> "$GITHUB_OUTPUT"

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 应用指定版本
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          dart run simple_live_app/tool/app_version.dart set "$REQUESTED_VERSION"

      - name: 同步派生版本文件
        env:
          APP_UPDATE_CHANNEL: ${{ github.ref_name == 'dev' && 'dev' || 'stable' }}
        run: dart run simple_live_app/tool/app_version.dart sync

      - name: 恢复依赖包
        working-directory: simple_live_app
        run: flutter pub get

      - name: 校验同步版本
        run: dart run simple_live_app/tool/app_version.dart check

      - name: 静态分析
        working-directory: simple_live_app
        run: dart analyze lib test

      - name: 运行测试
        working-directory: simple_live_app
        run: flutter test --no-pub

      - name: 解析发布元数据
        id: release
        shell: bash
        run: |
          version="$(dart run simple_live_app/tool/app_version.dart print name)"
          build_number="$(dart run simple_live_app/tool/app_version.dart print build-number)"
          full_version="$(dart run simple_live_app/tool/app_version.dart print full)"
          sha="$(git rev-parse HEAD)"
          # dev 分支用 v{version}-dev（带版本号，方便区分；-dev 后缀避免与
          # stable 正式 tag 冲突）；其他分支 prerelease 时用 v{version}-pre
          if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            tag="v${version}-dev"
          elif [[ "${{ steps.settings.outputs.prerelease }}" == "true" ]]; then
            tag="v${version}-pre"
          else
            tag="v$version"
          fi

          git fetch --force --tags origin
          if [[ "$GITHUB_REF_NAME" != "dev" ]] \
            && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tagged_sha" != "$sha" ]]; then
              echo "::error::标签 $tag 已指向 $tagged_sha，不能改指到 $sha。" >&2
              exit 1
            fi
          fi

          {
            echo "version=$version"
            echo "build_number=$build_number"
            echo "full_version=$full_version"
            echo "sha=$sha"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android APK 与 AAB
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: 准备 Android 分支签名
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
          DEV_STORE_PASSWORD: ${{ secrets.DEV_STORE_PASSWORD }}
          DEV_KEY_PASSWORD: ${{ secrets.DEV_KEY_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          STABLE_KEYSTORE_BASE64: ${{ secrets.STABLE_KEYSTORE_BASE64 }}
          STABLE_STORE_PASSWORD: ${{ secrets.STABLE_STORE_PASSWORD }}
          STABLE_KEY_PASSWORD: ${{ secrets.STABLE_KEY_PASSWORD }}
          STABLE_KEY_ALIAS: ${{ secrets.STABLE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          case "$BRANCH_NAME" in
            dev)
              KEYSTORE_BASE64="$DEV_KEYSTORE_BASE64"
              STORE_PASSWORD="$DEV_STORE_PASSWORD"
              KEY_PASSWORD="$DEV_KEY_PASSWORD"
              KEY_ALIAS="$DEV_KEY_ALIAS"
              ;;
            stable)
              KEYSTORE_BASE64="$STABLE_KEYSTORE_BASE64"
              STORE_PASSWORD="$STABLE_STORE_PASSWORD"
              KEY_PASSWORD="$STABLE_KEY_PASSWORD"
              KEY_ALIAS="$STABLE_KEY_ALIAS"
              ;;
            *)
              echo "::error::Android 发布构建只允许从 dev 或 stable 分支运行（当前：$BRANCH_NAME）。"
              exit 1
              ;;
          esac
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || \
                -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::$BRANCH_NAME 分支的 Android 签名 secrets 不完整。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | openssl base64 -d -A \
            > simple_live_app/android/release-keystore.jks
          printf 'storeFile=../release-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > simple_live_app/android/key.properties
          keytool -list -v -keystore simple_live_app/android/release-keystore.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep 'SHA256:'

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 应用临时发布版本
        env:
          APP_UPDATE_CHANNEL: ${{ github.ref_name == 'dev' && 'dev' || 'stable' }}
        run: >-
          dart run simple_live_app/tool/app_version.dart set
          "${{ needs.prepare.outputs.version }}"

      - name: 恢复依赖包
        working-directory: simple_live_app
        run: flutter pub get

      - name: 构建分架构 APK
        working-directory: simple_live_app
        run: flutter build apk --release --split-per-abi --no-pub

      - name: 暂存 Android 产物
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-android"
          mkdir -p "$out"
          src="simple_live_app/build/app/outputs/flutter-apk"
          # 诊断：确认 split-per-abi 的实际输出
          ls -la "$src" || true
          cp "$src/app-armeabi-v7a-release.apk" \
            "$out/simple-live-${{ needs.prepare.outputs.version }}-android-armeabi-v7a.apk"
          cp "$src/app-arm64-v8a-release.apk" \
            "$out/simple-live-${{ needs.prepare.outputs.version }}-android-arm64-v8a.apk"
          cp "$src/app-x86_64-release.apk" \
            "$out/simple-live-${{ needs.prepare.outputs.version }}-android-x86_64.apk"
          # 诊断：确认暂存结果（分架构 APK + 校验文件；不发布 universal/AAB）
          ls -la "$out"
          (cd "$out" && sha256sum -- * > SHA256SUMS-android.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ${{ runner.temp }}/release-android/*
          if-no-files-found: error
          retention-days: 14

  android_tv:
    name: Android TV APK
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: 准备 Android TV 分支签名
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
          DEV_STORE_PASSWORD: ${{ secrets.DEV_STORE_PASSWORD }}
          DEV_KEY_PASSWORD: ${{ secrets.DEV_KEY_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          STABLE_KEYSTORE_BASE64: ${{ secrets.STABLE_KEYSTORE_BASE64 }}
          STABLE_STORE_PASSWORD: ${{ secrets.STABLE_STORE_PASSWORD }}
          STABLE_KEY_PASSWORD: ${{ secrets.STABLE_KEY_PASSWORD }}
          STABLE_KEY_ALIAS: ${{ secrets.STABLE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          case "$BRANCH_NAME" in
            dev)
              KEYSTORE_BASE64="$DEV_KEYSTORE_BASE64"
              STORE_PASSWORD="$DEV_STORE_PASSWORD"
              KEY_PASSWORD="$DEV_KEY_PASSWORD"
              KEY_ALIAS="$DEV_KEY_ALIAS"
              ;;
            stable)
              KEYSTORE_BASE64="$STABLE_KEYSTORE_BASE64"
              STORE_PASSWORD="$STABLE_STORE_PASSWORD"
              KEY_PASSWORD="$STABLE_KEY_PASSWORD"
              KEY_ALIAS="$STABLE_KEY_ALIAS"
              ;;
            *)
              echo "::error::Android TV 发布构建只允许从 dev 或 stable 分支运行（当前：$BRANCH_NAME）。"
              exit 1
              ;;
          esac
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || \
                -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::$BRANCH_NAME 分支的 Android 签名 secrets 不完整。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | openssl base64 -d -A \
            > simple_live_tv_app/android/release-keystore.jks
          printf 'storeFile=../release-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > simple_live_tv_app/android/key.properties
          keytool -list -v -keystore simple_live_tv_app/android/release-keystore.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep 'SHA256:'

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.TV_FLUTTER_VERSION }}
          cache: true

      - name: 恢复 TV 依赖包
        working-directory: simple_live_tv_app
        run: flutter pub get

      - name: 构建 TV 通用 APK
        working-directory: simple_live_tv_app
        run: >-
          flutter build apk --release --no-pub
          --build-name=${{ needs.prepare.outputs.version }}
          --build-number=${{ needs.prepare.outputs.build_number }}

      - name: 暂存 Android TV 产物
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-android-tv"
          mkdir -p "$out"
          cp simple_live_tv_app/build/app/outputs/flutter-apk/app-release.apk \
            "$out/simple-live-tv-${{ needs.prepare.outputs.version }}-android-universal.apk"
          (cd "$out" && sha256sum -- * > SHA256SUMS-android-tv.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: release-android-tv
          path: ${{ runner.temp }}/release-android-tv/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS IPA
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.IOS_XCODE_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 应用临时发布版本
        env:
          APP_UPDATE_CHANNEL: ${{ github.ref_name == 'dev' && 'dev' || 'stable' }}
        run: >-
          dart run simple_live_app/tool/app_version.dart set
          "${{ needs.prepare.outputs.version }}"

      - name: 恢复依赖包
        working-directory: simple_live_app
        run: flutter pub get

      - name: 校验 Liquid Glass 图标资源
        shell: bash
        run: |
          test -f simple_live_app/ios/Runner/AppIconModern.icon/icon.json
          xcode_major="$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')"
          test "$xcode_major" -ge 26

      - name: 导入签名证书与描述文件
        if: ${{ needs.prepare.outputs.signed_ios == 'true' }}
        shell: bash
        env:
          CERT_P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          for name in CERT_P12 CERT_PASSWORD PROVISIONING_PROFILE TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::签名 IPA 缺少 $name 对应的 secret。" >&2
              exit 1
            fi
          done
          cert_path="$RUNNER_TEMP/cert.p12"
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$CERT_P12" | base64 --decode > "$cert_path"
          printf '%s' "$PROVISIONING_PROFILE" | base64 --decode > "$profile_path"
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -P "$CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" >/dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          uuid="$(grep -aA1 UUID "$profile_path" \
            | grep -o '[0-9A-Fa-f-]\{36\}' | head -1)"
          cp "$profile_path" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          rm -f "$cert_path" "$profile_path"

      - name: 构建未签名 iOS App
        if: ${{ needs.prepare.outputs.signed_ios != 'true' }}
        working-directory: simple_live_app
        run: flutter build ios --release --no-codesign --no-pub

      - name: 打包未签名 IPA
        if: ${{ needs.prepare.outputs.signed_ios != 'true' }}
        working-directory: simple_live_app/build/ios/iphoneos
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/Runner.app
          zip -q -r app-unsigned.ipa Payload

      - name: 构建已签名 IPA
        if: ${{ needs.prepare.outputs.signed_ios == 'true' }}
        working-directory: simple_live_app
        shell: bash
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST
          flutter build ipa --release --no-pub \
            --export-options-plist=ExportOptions.plist

      - name: 暂存 IPA
        shell: bash
        env:
          SIGNED_IOS: ${{ needs.prepare.outputs.signed_ios }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-ios"
          mkdir -p "$out"
          if [[ "$SIGNED_IOS" == "true" ]]; then
            src="$(find simple_live_app/build/ios/ipa -name '*.ipa' -type f | head -1)"
            suffix=signed
          else
            src="simple_live_app/build/ios/iphoneos/app-unsigned.ipa"
            suffix=unsigned
          fi
          test -f "$src"
          cp "$src" "$out/simple-live-${{ needs.prepare.outputs.version }}-ios-$suffix.ipa"
          (cd "$out" && shasum -a 256 -- * > SHA256SUMS-ios.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: ${{ runner.temp }}/release-ios/*
          if-no-files-found: error
          retention-days: 14

      - name: 清理签名材料
        if: ${{ always() && needs.prepare.outputs.signed_ios == 'true' }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" || true

  macos:
    name: macOS DMG
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 应用临时发布版本
        env:
          APP_UPDATE_CHANNEL: ${{ github.ref_name == 'dev' && 'dev' || 'stable' }}
        run: >-
          dart run simple_live_app/tool/app_version.dart set
          "${{ needs.prepare.outputs.version }}"

      - name: 启用 macOS 桌面并恢复依赖
        working-directory: simple_live_app
        run: |
          flutter config --enable-macos-desktop
          flutter pub get

      - name: 安装打包工具
        run: |
          npm install --global appdmg
          dart pub global activate fastforge $FASTFORGE_VERSION
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: 构建 macOS 安装包
        working-directory: simple_live_app
        run: fastforge package --platform macos --targets dmg --skip-clean

      - name: 暂存 macOS 产物
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-macos"
          mkdir -p "$out"
          while IFS= read -r -d '' file; do
            extension="${file##*.}"
            cp "$file" \
              "$out/simple-live-${{ needs.prepare.outputs.version }}-macos.$extension"
          done < <(find simple_live_app/build/dist -type f -name '*.dmg' -print0)
          count="$(find "$out" -type f | wc -l | tr -d ' ')"
          [[ "$count" -ge 1 ]]
          (cd "$out" && shasum -a 256 -- * > SHA256SUMS-macos.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ${{ runner.temp }}/release-macos/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows EXE 与 ZIP
    needs: prepare
    # Flutter 3.41 支持 VS 2022/2026；保留 windows-2022 镜像稳定构建。
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 应用临时发布版本
        env:
          APP_UPDATE_CHANNEL: ${{ github.ref_name == 'dev' && 'dev' || 'stable' }}
        shell: pwsh
        run: >-
          dart run simple_live_app/tool/app_version.dart set
          "${{ needs.prepare.outputs.version }}"

      - name: 启用 Windows 桌面并恢复依赖
        working-directory: simple_live_app
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: 安装 Inno Setup 与 Fastforge
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          dart pub global activate fastforge $env:FASTFORGE_VERSION
          $pubBin = Join-Path $env:LOCALAPPDATA "Pub\Cache\bin"
          $pubBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 构建 Windows 安装包
        working-directory: simple_live_app
        shell: pwsh
        run: fastforge package --platform windows --targets exe,zip --skip-clean

      - name: 暂存 Windows 产物
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "release-windows"
          New-Item -ItemType Directory -Force $out | Out-Null
          $files = Get-ChildItem -LiteralPath "simple_live_app\build\dist" -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".zip" }
          if ($files.Count -lt 2) { throw "Expected EXE and ZIP outputs." }
          foreach ($file in $files) {
            $extension = $file.Extension.ToLowerInvariant()
            $target = Join-Path $out "simple-live-${{ needs.prepare.outputs.version }}-windows$extension"
            Copy-Item -LiteralPath $file.FullName -Destination $target -Force
          }
          # 先收集 hash 到内存，再一次性写文件：避免 Get-ChildItem 惰性枚举
          # 与 Out-File 同时操作 $out 导致文件句柄冲突；同时排除校验文件自身。
          $lines = Get-ChildItem -LiteralPath $out -File |
            Where-Object { $_.Name -notlike 'SHA256SUMS*' } |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $lines | Out-File -LiteralPath (Join-Path $out "SHA256SUMS-windows.txt") -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ runner.temp }}/release-windows/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux AppImage 与 DEB
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 应用临时发布版本
        env:
          APP_UPDATE_CHANNEL: ${{ github.ref_name == 'dev' && 'dev' || 'stable' }}
        run: >-
          dart run simple_live_app/tool/app_version.dart set
          "${{ needs.prepare.outputs.version }}"

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libasound2-dev libmpv-dev mpv libepoxy-dev patchelf \
            plocate libfuse2t64
          wget -q -O "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          sudo install "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool

      - name: 启用 Linux 桌面并恢复依赖
        working-directory: simple_live_app
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: 安装 Fastforge
        run: |
          dart pub global activate fastforge $FASTFORGE_VERSION
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: 构建 Linux 安装包
        working-directory: simple_live_app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: fastforge package --platform linux --targets appimage,deb --skip-clean

      - name: 暂存 Linux 产物
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-linux"
          mkdir -p "$out"
          while IFS= read -r -d '' file; do
            case "$file" in
              *.AppImage) extension="AppImage" ;;
              *) extension="${file##*.}" ;;
            esac
            cp "$file" \
              "$out/simple-live-${{ needs.prepare.outputs.version }}-linux.$extension"
          done < <(find simple_live_app/build/dist -type f \
            \( -name '*.AppImage' -o -name '*.deb' \) -print0)
          count="$(find "$out" -type f | wc -l | tr -d ' ')"
          [[ "$count" -ge 2 ]]
          (cd "$out" && sha256sum -- * > SHA256SUMS-linux.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: ${{ runner.temp }}/release-linux/*
          if-no-files-found: error
          retention-days: 14

  ohos:
    name: HarmonyOS已签名 HAP
    needs: prepare
    if: ${{ needs.prepare.outputs.include_ohos == 'true' }}
    runs-on: [self-hosted, Windows, X64, harmonyos]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: 解析 runner 工具链
        shell: pwsh
        env:
          VAR_FLUTTER_OHOS_ROOT: ${{ vars.FLUTTER_OHOS_ROOT }}
          VAR_HOS_SDK_HOME: ${{ vars.HOS_SDK_HOME }}
          VAR_JAVA_HOME: ${{ vars.JAVA_HOME }}
          VAR_OHOS_PUB_CACHE: ${{ vars.OHOS_PUB_CACHE }}
        run: |
          $flutterRoot = if ($env:VAR_FLUTTER_OHOS_ROOT) { $env:VAR_FLUTTER_OHOS_ROOT } else { $env:FLUTTER_OHOS_ROOT }
          $sdkRoot = if ($env:VAR_HOS_SDK_HOME) { $env:VAR_HOS_SDK_HOME } else { $env:HOS_SDK_HOME }
          $javaHome = if ($env:VAR_JAVA_HOME) { $env:VAR_JAVA_HOME } else { $env:JAVA_HOME }
          $pubCache = if ($env:VAR_OHOS_PUB_CACHE) { $env:VAR_OHOS_PUB_CACHE } else { Join-Path $env:RUNNER_TEMP "pub-cache-ohos" }
          $required = @{
            FLUTTER_OHOS_ROOT = $flutterRoot
            HOS_SDK_HOME = $sdkRoot
            JAVA_HOME = $javaHome
          }
          foreach ($item in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($item.Value) -or -not (Test-Path -LiteralPath $item.Value)) {
              throw "Missing runner toolchain path: $($item.Key)."
            }
          }
          "FLUTTER_OHOS_ROOT=$flutterRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HOS_SDK_HOME=$sdkRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "JAVA_HOME=$javaHome" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PUB_CACHE=$pubCache" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 恢复签名材料
        shell: pwsh
        env:
          KEYSTORE_P12: ${{ secrets.OHOS_KEYSTORE_P12_BASE64 }}
          PROFILE_CERT_PEM: ${{ secrets.OHOS_PROFILE_CERT_PEM_BASE64 }}
          APP_CERT_CHAIN_PEM: ${{ secrets.OHOS_APP_CERT_CHAIN_PEM_BASE64 }}
          PROFILE_JSON: ${{ secrets.OHOS_PROFILE_JSON_BASE64 }}
        run: |
          $signingDir = Join-Path $env:RUNNER_TEMP "simple-live-ohos-signing"
          New-Item -ItemType Directory -Force $signingDir | Out-Null
          $files = @{
            "OpenHarmony.p12" = $env:KEYSTORE_P12
            "OpenHarmonyProfileRelease.pem" = $env:PROFILE_CERT_PEM
            "app-release-chain.pem" = $env:APP_CERT_CHAIN_PEM
            "profile-release.json" = $env:PROFILE_JSON
          }
          foreach ($item in $files.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($item.Value)) {
              throw "Missing OHOS signing secret for $($item.Key)."
            }
            [IO.File]::WriteAllBytes(
              (Join-Path $signingDir $item.Key),
              [Convert]::FromBase64String($item.Value)
            )
          }
          "OHOS_SIGNING_DIR=$signingDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 恢复依赖包 and check version
        working-directory: simple_live_app
        shell: pwsh
        env:
          APP_UPDATE_CHANNEL: ${{ github.ref_name == 'dev' && 'dev' || 'stable' }}
        run: |
          $flutter = Join-Path $env:FLUTTER_OHOS_ROOT "bin\flutter.bat"
          $dart = Join-Path $env:FLUTTER_OHOS_ROOT "bin\dart.bat"
          & $dart run tool/app_version.dart set "${{ needs.prepare.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "Version apply failed" }
          & $flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "flutter pub get failed" }
          & $dart run tool/app_version.dart check
          if ($LASTEXITCODE -ne 0) { throw "Version check failed" }

      - name: 构建已签名 HAP
        working-directory: simple_live_app
        shell: pwsh
        env:
          OHOS_KEYSTORE_PASSWORD: ${{ secrets.OHOS_KEYSTORE_PASSWORD }}
          OHOS_KEY_PASSWORD: ${{ secrets.OHOS_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OHOS_KEYSTORE_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:OHOS_KEY_PASSWORD)) {
            throw "Missing OHOS keystore passwords."
          }
          & .\tool\build_ohos_hap.ps1 `
            -FlutterRoot $env:FLUTTER_OHOS_ROOT `
            -SdkRoot $env:HOS_SDK_HOME `
            -JavaHome $env:JAVA_HOME `
            -PubCache $env:PUB_CACHE `
            -SigningDir $env:OHOS_SIGNING_DIR `
            -KeystorePassword $env:OHOS_KEYSTORE_PASSWORD `
            -KeyPassword $env:OHOS_KEY_PASSWORD
          if ($LASTEXITCODE -ne 0) { throw "HAP build failed" }

      - name: 暂存 HAP
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "release-ohos"
          New-Item -ItemType Directory -Force $out | Out-Null
          $source = Join-Path $env:GITHUB_WORKSPACE "simple_live_app\build\ohos\hap\simple_live_app-release-signed.hap"
          $target = Join-Path $out "simple-live-${{ needs.prepare.outputs.version }}-ohos-arm64-signed.hap"
          Copy-Item -LiteralPath $source -Destination $target -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($target))" |
            Out-File -LiteralPath (Join-Path $out "SHA256SUMS-ohos.txt") -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: release-ohos
          path: ${{ runner.temp }}/release-ohos/*
          if-no-files-found: error
          retention-days: 14

      - name: 移除签名材料
        if: always()
        shell: pwsh
        run: |
          if ($env:OHOS_SIGNING_DIR -and (Test-Path -LiteralPath $env:OHOS_SIGNING_DIR)) {
            Remove-Item -LiteralPath $env:OHOS_SIGNING_DIR -Recurse -Force
          }

  release:
    name: 发布 GitHub Release
    needs: [prepare, android, android_tv, ios, macos, windows, linux, ohos]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # 仅最终发布 job 可创建 Release、更新固定 tag 和独立 IPA 源分支。
    # prepare 与各平台构建 job 保持 contents: read，不能回写源码分支。
    permissions:
      contents: write
    steps:
      - name: 校验构建任务
        shell: bash
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_TV_RESULT: ${{ needs.android_tv.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          OHOS_RESULT: ${{ needs.ohos.result }}
          INCLUDE_OHOS: ${{ needs.prepare.outputs.include_ohos }}
        run: |
          for pair in \
            "Android:$ANDROID_RESULT" \
            "Android TV:$ANDROID_TV_RESULT" \
            "iOS:$IOS_RESULT" \
            "macOS:$MACOS_RESULT" \
            "Windows:$WINDOWS_RESULT" \
            "Linux:$LINUX_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name build result: $result" >&2
              exit 1
            fi
          done
          if [[ "$INCLUDE_OHOS" == "true" && "$OHOS_RESULT" != "success" ]]; then
            echo "::error::HarmonyOS build result: $OHOS_RESULT" >&2
            exit 1
          fi

      - name: 检出源码（What's Changed 需要 git 历史与 tags）
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: 下载全部发布产物
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: 生成汇总校验文件与 Release 简介
        shell: bash
        env:
          FULL_VERSION: ${{ needs.prepare.outputs.full_version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # 诊断：确认下载到 release-assets 的产物（应含各平台文件与分架构 APK）
          ls -la release-assets || true
          # 汇总校验值写入 body，不再作为 asset 上传（排除各平台 SHA256SUMS-*.txt）
          cd release-assets
          mapfile -t files < <(ls | grep -v '^SHA256SUMS')
          sha256sum -- "${files[@]}" > "$RUNNER_TEMP/sha256.txt"
          # SHA 值已汇总进 body（sha256.txt），删除各平台 SHA256SUMS-*.txt，
          # 避免作为 Release 附件上传（softprops 不支持 '!' 排除模式）。
          rm -f SHA256SUMS-*.txt
          body="$RUNNER_TEMP/release_body.md"

          # 收集本次变更的 commit 列表（上一 tag..HEAD，无 tag 时最近 30 条）
          # 已 cd release-assets（无 .git），git 命令用 -C 指向 workspace
          commits=""
          if [[ -n "$TAG" ]]; then
            prev_tag="$(git -C "$GITHUB_WORKSPACE" tag --sort=-v:refname | grep -v "^$TAG\$" | head -1 || true)"
            if [[ -n "$prev_tag" ]]; then
              commits="$(git -C "$GITHUB_WORKSPACE" log --oneline --no-merges --max-count=80 "$prev_tag..HEAD")"
            fi
          fi
          if [[ -z "$commits" ]]; then
            commits="$(git -C "$GITHUB_WORKSPACE" log --oneline --no-merges -30 HEAD)"
          fi

          # AI 总结 What's Changed（配置 DEEPSEEK_API_KEY secret 时生效；
          # 失败/无 key 自动回退到过滤后的用户侧 git log）
          ai_summary=""
          # Release 简介只关注用户可感知的 App 变化，先排除纯仓库维护提交。
          ai_commits="$(
            printf '%s\n' "$commits" \
              | grep -Eiv '^[0-9a-f]+ (ci|docs|test|chore|build)(\([^)]*\))?!?:|workflow|readme|version number|release v?[0-9]|发布流程|发布产物|版本号' \
              || true
          )"
          if [[ -n "$DEEPSEEK_API_KEY" && -n "$ai_commits" ]]; then
            ai_response="$(
              jq -n --arg commits "$ai_commits" \
                '{model:"deepseek-v4-flash",temperature:0.1,
                  response_format:{type:"json_object"},
                  messages:[
                    {role:"system",content:"你是 Simple Live 的发布说明编辑。请把 git commit 列表归纳成只面向 App 用户的简体中文更新说明。只写用户能在 App 中直接看到、使用或感受到的功能、界面、播放体验、平台兼容性和问题修复。彻底忽略 GitHub Actions/workflow、CI、README、文档、源码文件、测试、重构、格式化、纯依赖升级、版本号、签名配置、内部打包步骤和发布流程，即使提交列表包含这些内容也不得提及。平台支持、系统兼容性、新增可下载平台或架构属于用户可见变化，应归入 engineering。你必须只输出一个合法 JSON 对象，不得输出 Markdown、代码围栏、前言或结语。JSON 必须且只能包含 highlights、improvements、fixes、engineering 四个数组字段。分类规则：highlights=值得优先关注的新功能或明显变化；improvements=用户体验、界面或性能优化；fixes=用户遇到的问题修复与稳定性提升；engineering=用户相关的平台支持、系统适配、架构支持或安装包变化。每项是一句不超过 36 个汉字的字符串，每个数组最多 4 项，无内容时使用空数组。合并同类提交，不逐条翻译，不写 commit hash，不编造提交信息无法确认的效果。每条必须点明具体功能、页面、平台或问题；禁止“优化分发效率”“提升用户体验”“提升整体体验”等缺少具体对象的套话。文案统一使用简体中文和中文标点，iOS、Android、Windows、Linux、macOS、HarmonyOS、TV 等正式名称保留原文。条目只用纯文本，禁止加粗、斜体、删除线、行内代码、链接、emoji 或其他装饰符号。"},
                    {role:"user",content:("请严格按约定 JSON 格式总结以下提交：\n\n" + $commits)}
                  ]}' \
              | curl -sS https://api.deepseek.com/chat/completions \
                  -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
                  -H "Content-Type: application/json" -d @- \
              | jq -r '.choices[0].message.content // empty' 2>/dev/null || true
            )"

            # AI 只负责结构化归纳，标题、顺序和 Markdown 均由脚本固定生成。
            # 返回值不符合约定时保留 ai_summary 为空，走下方原有兜底。
            if jq -e '
              type == "object" and
              ([keys[]] | sort == ["engineering", "fixes", "highlights", "improvements"]) and
              ([.highlights, .improvements, .fixes, .engineering] |
                all(type == "array" and length <= 4 and
                  all(type == "string" and length > 0 and length <= 36 and
                    (test("[vV]?[0-9]+\\.[0-9]+(\\.[0-9]+)?") | not) and
                    (test("workflow|readme|github|文档|源码|仓库|测试|依赖|版本号|更新版本|版本更新|签名配置|构建流程|构建脚本|构建配置|内部打包|发布流程|发布产物|分发"; "i") | not) and
                    (test("优化分发效率|提升用户体验|优化使用体验|提升使用体验|提升整体体验") | not) and
                    (test("[*_`#~]|https?://|\\[[^]]*\\]\\(") | not))))
            ' <<< "$ai_response" >/dev/null 2>&1; then
              ai_summary="$(
                jq -r '
                  def section($title; $items):
                    if ($items | length) > 0 then
                      "### " + $title + "\n" +
                      ($items | map("- " + .) | join("\n")) + "\n"
                    else "" end;
                  section("更新亮点"; .highlights) +
                  section("体验优化"; .improvements) +
                  section("问题修复"; .fixes) +
                  section("构建与适配"; .engineering)
                ' <<< "$ai_response"
              )"
            fi
          fi

          {
            echo "版本：\`$FULL_VERSION\`"
            echo "提交：\`$SHA\`"
            echo ""
            echo "### SHA-256 校验"
            echo '```'
            cat "$RUNNER_TEMP/sha256.txt"
            echo '```'
            echo ""
            echo "## What's Changed"
            echo ""
            if [[ -n "$ai_summary" ]]; then
              echo "$ai_summary"
            elif [[ -n "$ai_commits" ]]; then
              printf '%s\n' "$ai_commits" \
                | sed -E 's/^[0-9a-f]+[[:space:]]+//; s/^(feat|fix|style|perf)(\([^)]*\))?!?:[[:space:]]*//; s/^/- /'
            else
              echo "- 本次没有可归纳的用户可见变更"
            fi
          } > "$body"
          echo "body_path=$body" >> "$GITHUB_ENV"
          echo "### Release assets" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          find . -maxdepth 1 -type f -name '!SHA256SUMS*' -printf '%f\n' \
            | sort | sed 's/^/- `/' | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
          # 复制 iOS 产物为固定名 simple-live.ipa（供 IPA 源 ios-dev/ios-stable tag）
          ipa_src="$(ls simple-live-*-ios-*.ipa 2>/dev/null | head -1)"
          if [[ -n "$ipa_src" ]]; then
            cp "$ipa_src" "$RUNNER_TEMP/simple-live.ipa"
            echo "iOS 固定名: $ipa_src"
          else
            echo "::warning::未找到 iOS IPA 产物，跳过固定名复制。"
          fi

      - name: 上传汇总产物
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-${{ needs.prepare.outputs.version }}-all-platforms
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: ${{ needs.prepare.outputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Simple Live ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          fail_on_unmatched_files: true
          # v-dev 等固定 tag 每次构建覆盖更新（dev 分支重复发布必须）
          allowUpdates: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          body_path: ${{ env.body_path }}
          # SHA256SUMS-*.txt 已在"生成汇总校验"步骤删除，files 不需要排除模式
          # （softprops 不支持 '!' 负向 glob，会报 does not match any files）
          files: release-assets/*

      - name: 发布 iOS IPA 源（固定 tag + 独立源分支）
        if: ${{ needs.prepare.outputs.publish_release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # dev 与 stable 分别写入 ipa-source / ipa-stable，互不覆盖。
          if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            CHANNEL="dev"
            SOURCE_BRANCH="ipa-source"
            SOURCE_FILE="apps.json"
            IOS_TAG="ios-dev"
          else
            CHANNEL="stable"
            SOURCE_BRANCH="ipa-stable"
            SOURCE_FILE="apps.json"
            IOS_TAG="ios-stable"
          fi

          # 先发布固定 IPA；成功后再更新源元数据，避免源版本领先于实际附件。
          if [[ ! -f "$RUNNER_TEMP/simple-live.ipa" ]]; then
            echo "::warning::无 iOS IPA（可能未勾 iOS 构建），跳过 IPA 源发布。"
            exit 0
          fi
          if gh release view "$IOS_TAG" >/dev/null 2>&1; then
            gh release upload "$IOS_TAG" "$RUNNER_TEMP/simple-live.ipa" --clobber
          else
            gh release create "$IOS_TAG" "$RUNNER_TEMP/simple-live.ipa" \
              --title "Simple Live iOS ($IOS_TAG)" \
              --notes "自动发布自全平台构建（$VERSION）。AltStore/LiveContainer 源：\`$SOURCE_FILE\`"
          fi
          bash "$GITHUB_WORKSPACE/.github/scripts/update_ipa_source.sh" \
            "$CHANNEL" "$VERSION"
          echo "iOS 源已更新：$SOURCE_BRANCH/$SOURCE_FILE / $IOS_TAG / $VERSION"
