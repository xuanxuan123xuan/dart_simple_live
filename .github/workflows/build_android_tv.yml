name: 构建 Android TV APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "可选版本号（如 1.13）；留空使用 pubspec 当前版本"
        required: false
        type: string

permissions:
  contents: read

env:
  TV_FLUTTER_VERSION: "3.41.x"

jobs:
  build:
    name: 构建 Android TV APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.TV_FLUTTER_VERSION }}
          cache: true

      - name: 应用指定版本
        if: ${{ inputs.version != '' }}
        shell: pwsh
        working-directory: simple_live_tv_app
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $requested = $env:REQUESTED_VERSION.Trim() -replace '^[vV]', ''
          $match = [regex]::Match($requested, '^(\d+)\.(\d+)(?:\.(\d+))?$')
          if (-not $match.Success) { throw "版本号必须是 major.minor 或 major.minor.patch。" }

          $major = [int]$match.Groups[1].Value
          $minor = [int]$match.Groups[2].Value
          $patch = if ($match.Groups[3].Success) { [int]$match.Groups[3].Value } else { 0 }
          $version = "$major.$minor.$patch"
          $buildNumber = $major * 1000 + $minor * 100 + $patch
          $expectedLine = "version: $version+$buildNumber"

          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*[^\r\n]+') {
            throw "pubspec.yaml 中缺少 version 字段。"
          }
          $pubspec = [regex]::Replace($pubspec, '(?m)^version:\s*[^\r\n]+', $expectedLine, 1)
          Set-Content pubspec.yaml $pubspec -NoNewline

          $actualLine = (Get-Content pubspec.yaml |
            Where-Object { $_ -match '^version:' } |
            Select-Object -First 1).Trim()
          if ($actualLine -ne $expectedLine) {
            throw "版本写入校验失败：期望 '$expectedLine'，实际 '$actualLine'。"
          }
          Write-Host "已应用 Android TV 版本：$actualLine"

      - name: 校验应用版本
        working-directory: simple_live_tv_app
        shell: pwsh
        run: Get-Content pubspec.yaml | Select-String '^version:'

      - name: 准备 Android TV 分支签名
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
          DEV_STORE_PASSWORD: ${{ secrets.DEV_STORE_PASSWORD }}
          DEV_KEY_PASSWORD: ${{ secrets.DEV_KEY_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          STABLE_KEYSTORE_BASE64: ${{ secrets.STABLE_KEYSTORE_BASE64 }}
          STABLE_STORE_PASSWORD: ${{ secrets.STABLE_STORE_PASSWORD }}
          STABLE_KEY_PASSWORD: ${{ secrets.STABLE_KEY_PASSWORD }}
          STABLE_KEY_ALIAS: ${{ secrets.STABLE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          case "$BRANCH_NAME" in
            dev)
              KEYSTORE_BASE64="$DEV_KEYSTORE_BASE64"
              STORE_PASSWORD="$DEV_STORE_PASSWORD"
              KEY_PASSWORD="$DEV_KEY_PASSWORD"
              KEY_ALIAS="$DEV_KEY_ALIAS"
              ;;
            stable)
              KEYSTORE_BASE64="$STABLE_KEYSTORE_BASE64"
              STORE_PASSWORD="$STABLE_STORE_PASSWORD"
              KEY_PASSWORD="$STABLE_KEY_PASSWORD"
              KEY_ALIAS="$STABLE_KEY_ALIAS"
              ;;
            *)
              echo "::error::Android TV 发布构建只允许从 dev 或 stable 分支运行（当前：$BRANCH_NAME）。"
              exit 1
              ;;
          esac
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || \
                -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::$BRANCH_NAME 分支的 Android 签名 secrets 不完整。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | openssl base64 -d -A \
            > simple_live_tv_app/android/release-keystore.jks
          printf 'storeFile=../release-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > simple_live_tv_app/android/key.properties
          keytool -list -v -keystore simple_live_tv_app/android/release-keystore.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep 'SHA256:'

      - name: 恢复 TV 依赖包
        working-directory: simple_live_tv_app
        run: flutter pub get

      - name: 构建 TV 通用 APK
        working-directory: simple_live_tv_app
        run: flutter build apk --release --no-pub

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-apk
          path: simple_live_tv_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
