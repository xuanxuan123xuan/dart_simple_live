name: Simple Live native tvOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'simple_live_tvos_native/**'
      - 'simple_live_tvos_core/**'
      - 'tool/build_tvos_native.sh'
      - '.github/workflows/tvos-native.yml'
  pull_request:
    paths:
      - 'simple_live_tvos_native/**'
      - 'simple_live_tvos_core/**'
      - 'tool/build_tvos_native.sh'
      - '.github/workflows/tvos-native.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Xcode tooling
        run: |
          xcodebuild -version
          command -v xcodegen || brew install xcodegen
          if ! xcrun --find metal >/dev/null 2>&1 || ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Cache pinned player dependencies
        uses: actions/cache@v4
        with:
          path: simple_live_tvos_native/build/vendor
          key: tvos-native-player-${{ hashFiles('tool/build_tvos_native.sh') }}

      - name: Test native Swift core
        run: swift test --package-path simple_live_tvos_core

      - name: Run hosted tvOS tests
        run: |
          set -euo pipefail
          simulator="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          devices = json.load(sys.stdin)["devices"]
          print(next((d["udid"] for k,v in devices.items() if ".tvOS-" in k for d in v if d.get("isAvailable")), ""))
          ')"
          if [[ -z "$simulator" ]]; then
            xcodebuild -downloadPlatform tvOS
            runtime="$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          print(next(d["identifier"] for d in reversed(json.load(sys.stdin)["runtimes"]) if ".tvOS-" in d["identifier"] and d.get("isAvailable")))
          ')"
            simulator="$(xcrun simctl create 'Simple Live TV' 'com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-1080p' "$runtime")"
          fi
          tool/build_tvos_native.sh -destination "platform=tvOS Simulator,id=$simulator" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/SimpleLiveTVOS.xcresult" test

      - name: Build unsigned Apple TV app
        run: tool/build_tvos_native.sh -destination 'generic/platform=tvOS' CODE_SIGNING_ALLOWED=NO build
