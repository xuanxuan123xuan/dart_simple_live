name: 构建HarmonyOS HAP

on:
  workflow_dispatch:
  push:
    branches:
      - stable
    paths:
      - "simple_live_app/**"
      - "simple_live_core/**"
      - "third_party/**"
      - ".github/workflows/build_ohos_hap.yml"

concurrency:
  group: ohos-hap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-hap:
    # Official HarmonyOS command-line tools require an account and are about
    # 2.4 GB. Install Flutter OHOS, HarmonyOS SDK and JDK 17 once on this runner.
    runs-on: [self-hosted, Windows, X64, harmonyos]
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 解析 runner 工具链
        shell: pwsh
        env:
          VAR_FLUTTER_OHOS_ROOT: ${{ vars.FLUTTER_OHOS_ROOT }}
          VAR_HOS_SDK_HOME: ${{ vars.HOS_SDK_HOME }}
          VAR_JAVA_HOME: ${{ vars.JAVA_HOME }}
          VAR_OHOS_PUB_CACHE: ${{ vars.OHOS_PUB_CACHE }}
        run: |
          $flutterRoot = if ($env:VAR_FLUTTER_OHOS_ROOT) { $env:VAR_FLUTTER_OHOS_ROOT } else { $env:FLUTTER_OHOS_ROOT }
          $sdkRoot = if ($env:VAR_HOS_SDK_HOME) { $env:VAR_HOS_SDK_HOME } else { $env:HOS_SDK_HOME }
          $javaHome = if ($env:VAR_JAVA_HOME) { $env:VAR_JAVA_HOME } else { $env:JAVA_HOME }
          $pubCache = if ($env:VAR_OHOS_PUB_CACHE) { $env:VAR_OHOS_PUB_CACHE } else { Join-Path $env:RUNNER_TEMP "pub-cache-ohos" }

          $required = @{
            FLUTTER_OHOS_ROOT = $flutterRoot
            HOS_SDK_HOME = $sdkRoot
            JAVA_HOME = $javaHome
          }
          foreach ($item in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($item.Value) -or -not (Test-Path -LiteralPath $item.Value)) {
              throw "Missing runner toolchain path: $($item.Key). Set it as a repository variable or runner environment variable."
            }
          }

          "FLUTTER_OHOS_ROOT=$flutterRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOS_SDK_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PUB_CACHE=$pubCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 从 secrets 恢复签名材料
        shell: pwsh
        env:
          KEYSTORE_P12: ${{ secrets.OHOS_KEYSTORE_P12_BASE64 }}
          PROFILE_CERT_PEM: ${{ secrets.OHOS_PROFILE_CERT_PEM_BASE64 }}
          APP_CERT_CHAIN_PEM: ${{ secrets.OHOS_APP_CERT_CHAIN_PEM_BASE64 }}
          PROFILE_JSON: ${{ secrets.OHOS_PROFILE_JSON_BASE64 }}
        run: |
          $signingDir = Join-Path $env:RUNNER_TEMP "simple-live-ohos-signing"
          New-Item -ItemType Directory -Force $signingDir | Out-Null
          $files = @{
            "OpenHarmony.p12" = $env:KEYSTORE_P12
            "OpenHarmonyProfileRelease.pem" = $env:PROFILE_CERT_PEM
            "app-release-chain.pem" = $env:APP_CERT_CHAIN_PEM
            "profile-release.json" = $env:PROFILE_JSON
          }
          foreach ($item in $files.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($item.Value)) {
              throw "Missing GitHub Actions signing secret for $($item.Key)."
            }
            [IO.File]::WriteAllBytes(
              (Join-Path $signingDir $item.Key),
              [Convert]::FromBase64String($item.Value)
            )
          }
          "OHOS_SIGNING_DIR=$signingDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 解析 Flutter 依赖
        working-directory: simple_live_app
        shell: pwsh
        run: |
          & (Join-Path $env:FLUTTER_OHOS_ROOT "bin\flutter.bat") pub get
          if ($LASTEXITCODE -ne 0) { throw "flutter pub get failed" }

      - name: 校验同步应用版本
        id: appver
        working-directory: simple_live_app
        shell: pwsh
        env:
          APP_UPDATE_CHANNEL: ${{ github.ref_name == 'dev' && 'dev' || 'stable' }}
        run: |
          $dart = Join-Path $env:FLUTTER_OHOS_ROOT "bin\dart.bat"
          & $dart run tool/app_version.dart check
          if ($LASTEXITCODE -ne 0) { throw "App version check failed" }
          $version = (& $dart run tool/app_version.dart print name).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Reading app version failed" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 运行测试
        working-directory: simple_live_app
        shell: pwsh
        run: |
          & (Join-Path $env:FLUTTER_OHOS_ROOT "bin\flutter.bat") test
          if ($LASTEXITCODE -ne 0) { throw "Flutter tests failed" }

      - name: 构建、签名并校验 HAP
        working-directory: simple_live_app
        shell: pwsh
        env:
          OHOS_KEYSTORE_PASSWORD: ${{ secrets.OHOS_KEYSTORE_PASSWORD }}
          OHOS_KEY_PASSWORD: ${{ secrets.OHOS_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OHOS_KEYSTORE_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:OHOS_KEY_PASSWORD)) {
            throw "Missing OHOS_KEYSTORE_PASSWORD or OHOS_KEY_PASSWORD secret."
          }
          & .\tool\build_ohos_hap.ps1 `
            -FlutterRoot $env:FLUTTER_OHOS_ROOT `
            -SdkRoot $env:HOS_SDK_HOME `
            -JavaHome $env:JAVA_HOME `
            -PubCache $env:PUB_CACHE `
            -SigningDir $env:OHOS_SIGNING_DIR `
            -KeystorePassword $env:OHOS_KEYSTORE_PASSWORD `
            -KeyPassword $env:OHOS_KEY_PASSWORD
          if ($LASTEXITCODE -ne 0) { throw "HAP build failed" }

      - name: 暂存产物
        id: artifact
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "simple_live_app\build\ohos\hap\simple_live_app-release-signed.hap"
          $artifactDir = Join-Path $env:RUNNER_TEMP "ohos-hap-artifact"
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $appVersion = "${{ steps.appver.outputs.version }}"
          $target = Join-Path $artifactDir "dart_simple_live-$appVersion-ohos-arm64-$shortSha.hap"
          Copy-Item -LiteralPath $source -Destination $target -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash
          "artifact_dir=$artifactDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "### HarmonyOS HAP`n`nSHA-256: ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: 上传已签名 HAP
        uses: actions/upload-artifact@v4
        with:
          name: dart-simple-live-ohos-arm64-${{ github.sha }}
          path: ${{ steps.artifact.outputs.artifact_dir }}/*.hap
          if-no-files-found: error
          retention-days: 14

      - name: 移除临时签名材料
        if: always()
        shell: pwsh
        run: |
          if ($env:OHOS_SIGNING_DIR -and (Test-Path -LiteralPath $env:OHOS_SIGNING_DIR)) {
            Remove-Item -LiteralPath $env:OHOS_SIGNING_DIR -Recurse -Force
          }
