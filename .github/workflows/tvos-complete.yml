name: SimpleLive tvOS (dev - unsigned compile)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - feature/tvos
    paths:
      - 'simple_live_tvos_app/**'
      - 'simple_live_core/**'
      - 'third_party/dart_quickjs_stub/**'
      - '.github/workflows/tvos-complete.yml'

permissions:
  contents: read

jobs:
  tvos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install flutter-tvos (pinned release)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v3.47.9-tvos.1.11.5 \
            https://github.com/fluttertv/flutter-tvos.git "$RUNNER_TEMP/flutter-tvos"
          echo "$RUNNER_TEMP/flutter-tvos/bin" >> "$GITHUB_PATH"

      - name: Precache engine
        shell: bash
        run: |
          set -euo pipefail
          flutter-tvos precache
          flutter-tvos doctor -v

      - name: Create native tvOS runner (do not overwrite Dart code)
        shell: bash
        run: |
          set -euo pipefail
          flutter-tvos create --project-name simple_live_tvos_app \
            "$RUNNER_TEMP/tvos-scaffold"
          test -d "$RUNNER_TEMP/tvos-scaffold/tvos"
          cp -R "$RUNNER_TEMP/tvos-scaffold/tvos" simple_live_tvos_app/tvos
          # Live hosts/CDN streams may return http URLs. Only enable this for
          # a source you trust; ATS still enforces other platform policies.
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity dict' \
            simple_live_tvos_app/tvos/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true' \
            simple_live_tvos_app/tvos/Runner/Info.plist || true
          # Use standard dynamic-registry with federated tvOS plugins.

      - name: Resolve, analyze and test Dart source
        working-directory: simple_live_tvos_app
        shell: bash
        run: |
          set -euo pipefail
          flutter-tvos pub get
          flutter-tvos analyze --no-fatal-infos
          flutter-tvos test

      - name: Compile tvOS simulator app
        working-directory: simple_live_tvos_app
        shell: bash
        run: flutter-tvos build tvos --simulator --debug

      - name: Compile unsigned tvOS device build
        working-directory: simple_live_tvos_app
        shell: bash
        run: flutter-tvos build tvos --release --no-codesign

      - name: Package unsigned app for inspection
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find simple_live_tvos_app/build/tvos -type d -name '*.app' \
            ! -path '*simulator*' | head -n 1)"
          if [ -z "$APP" ]; then
            echo 'No physical-device .app produced' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/tvos-payload/Payload"
          ditto "$APP" "$RUNNER_TEMP/tvos-payload/Payload/$(basename "$APP")"
          ( cd "$RUNNER_TEMP/tvos-payload" && zip -qry \
            "$GITHUB_WORKSPACE/SimpleLive-tvOS-UNSIGNED.ipa" Payload )
          echo 'Unsigned archive - not an installable/signed IPA' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-tvOS-unsigned
          path: SimpleLive-tvOS-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 7
