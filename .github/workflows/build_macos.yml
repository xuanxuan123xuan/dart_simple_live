name: 构建 macOS 安装包

on:
  workflow_dispatch:
    inputs:
      version:
        description: "可选版本号（如 1.13）；留空使用 pubspec 当前版本"
        required: false
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.x"
  # Icon Composer 资源使用与 macOS 26 主机匹配的 Xcode，避免 macOS 15
  # runner 上 AssetCatalogAgent 的系统框架符号不兼容。
  XCODE_VERSION: "26.6"
  FASTFORGE_VERSION: "0.6.10"

jobs:
  build:
    name: 构建 macOS DMG
    # Liquid Glass 的 .icon 包需要在 macOS 26 主机上编译。
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 选择 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: 校验 Liquid Glass 图标资源
        shell: bash
        run: |
          # .icon 与同名 AppIcon.appiconset 并存：macOS 26+ 用前者出液态玻璃，
          # 更低版本回落到后者的扁平图。
          test -f simple_live_app/macos/Runner/AppIcon.icon/icon.json
          test -f simple_live_app/macos/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json
          macos_major="$(sw_vers -productVersion | cut -d. -f1)"
          xcode_major="$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')"
          test "$macos_major" -ge 26
          test "$xcode_major" -ge 26

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 启用 macOS 桌面并恢复依赖
        working-directory: simple_live_app
        run: |
          flutter config --enable-macos-desktop
          flutter pub get

      - name: 安装打包工具
        run: |
          npm install --global appdmg
          dart pub global activate fastforge $FASTFORGE_VERSION
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: 构建 macOS 安装包
        working-directory: simple_live_app
        run: fastforge package --platform macos --targets dmg --skip-clean

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: simple_live_app/build/dist/**
          if-no-files-found: error
          retention-days: 14
