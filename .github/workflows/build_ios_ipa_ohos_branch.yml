name: Build iOS IPA (ohos branch)

# 本分支专用的 iOS 构建。
#
# 与 publish_app_release_ios_manual.yml 分开的原因：那个 workflow 钉
# flutter-version 3.41.x，服务的是主线；本分支的 pubspec 是围着
# Flutter 3.22 整体钉死的（intl / archive / lottie / package_info_plus /
# window_manager / shelf / dynamic_color 共 7 处 "3.22 compatible" 注释），
# 3.38 与 3.41 都会在 flutter_localizations 的 intl 传递依赖上解析失败：
#   simple_live_app depends on intl 0.19.0
#   flutter_localizations from sdk depends on intl 0.20.2
# 因此这里钉 3.22.3，与 pubspec 保持一致，不动任何依赖版本。
#
# 注意：不读 simple_live_app/.fvmrc。那里写的 3.38.3 与本目录 pubspec
# 对不上（鸿蒙 hap 走 build_ohos_hap.ps1 里自带的 OHOS Flutter fork，
# 同属 3.22 线，也不读 .fvmrc）。
#
# Xcode 必须钉 15.4：Flutter 3.22 早于 Xcode 16，用 16.x 会在链接期报
# undefined symbols。macos-14 镜像默认即 15.4，这里仍显式指定，避免
# 镜像默认版本变动后静默走到 16.x。
#
# 产物默认是未签名 IPA，需要 AltStore / Sideloadly 之类的工具侧载。
# 配好证书 secrets 后可勾选 signed 产出可直接安装的已签名 IPA。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 git ref，默认当前分支"
        required: false
        default: "feat/ohos-1.12.7"
      signed:
        description: "签名构建（需配好证书 secrets，否则请留空产出未签名 IPA）"
        type: boolean
        default: false
      run_tests:
        description: "构建前跑一遍 flutter test"
        type: boolean
        default: true
      publish_release:
        description: "构建后发布到 GitHub Release（附件为直接 .ipa，不套 zip）"
        type: boolean
        default: false

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

# 发布 Release 附件需要 contents: write；缺了 softprops/action-gh-release
# 会用只读 GITHUB_TOKEN 创建 release 报 403。
permissions:
  contents: write

env:
  # 与 simple_live_app/pubspec.yaml 里那 7 处 "Flutter 3.22 compatible" 对齐。
  FLUTTER_VERSION: "3.22.3"
  XCODE_VERSION: "15.4"

jobs:
  build-ios:
    # 不用 macos-latest：那是 Xcode 16 镜像，Flutter 3.22 在上面链接会失败。
    # macos-14 自 2026-07-06 起进入弃用期，2026-11-02 后不可用，届时本
    # workflow 需连同 Flutter 版本一起升级。
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # pubspec 的 3.22 pin 与所用 Flutter 必须一致，否则 pub get 会在
      # flutter_localizations 的 intl 传递依赖上失败。这里提前核对，
      # 让报错指向真正的原因而不是一长串 version solving 输出。
      - name: Verify toolchain matches pubspec pins
        shell: bash
        run: |
          actual="$(flutter --version | sed -n 's/^Flutter \([0-9.]*\).*/\1/p' | head -1)"
          echo "Flutter: $actual"
          echo "Xcode:   $(xcodebuild -version | head -1)"
          if [[ "$actual" != 3.22.* ]]; then
            echo "::error::Flutter $actual 与 pubspec 的 3.22 pin 不符。" >&2
            echo "pubspec.yaml 有 7 处依赖按 Flutter 3.22 钉死，换版本需同时调整这些依赖。" >&2
            exit 1
          fi
          intl_pin="$(sed -n 's/^  intl:[[:space:]]*\([0-9.]*\).*/\1/p' simple_live_app/pubspec.yaml | head -1)"
          if [[ "$intl_pin" != "0.19.0" ]]; then
            echo "::warning::pubspec 的 intl 已改为 $intl_pin，不再是 3.22 线的 0.19.0；请确认 FLUTTER_VERSION 是否也该跟着调整。"
          fi

      - name: Resolve dependencies
        working-directory: simple_live_app
        run: flutter pub get

      - name: Run tests
        if: ${{ inputs.run_tests }}
        working-directory: simple_live_app
        run: flutter test

      - name: Read app version
        id: appver
        shell: bash
        run: |
          raw="$(grep -m1 '^version:' simple_live_app/pubspec.yaml | sed 's/version:[[:space:]]*//')"
          echo "version=${raw%%+*}" >> "$GITHUB_OUTPUT"

      # ---------- 未签名路径 ----------

      - name: Build iOS (unsigned)
        if: ${{ !inputs.signed }}
        working-directory: simple_live_app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        if: ${{ !inputs.signed }}
        working-directory: simple_live_app/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -q -r app-unsigned.ipa Payload

      # ---------- 签名路径 ----------

      - name: Import signing certificate and profile
        if: ${{ inputs.signed }}
        env:
          CERT_P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in CERT_P12 CERT_PASSWORD PROVISIONING_PROFILE; do
            if [[ -z "${!name}" ]]; then
              echo "签名构建缺少 secret：$name" >&2
              echo "需要配置 IOS_CERT_P12_BASE64 / IOS_CERT_PASSWORD /" >&2
              echo "IOS_PROVISIONING_PROFILE_BASE64 / IOS_TEAM_ID" >&2
              exit 1
            fi
          done

          cert_path="$RUNNER_TEMP/cert.p12"
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          echo "$CERT_P12" | base64 --decode > "$cert_path"
          echo "$PROVISIONING_PROFILE" | base64 --decode > "$profile_path"

          # 临时钥匙串，随 runner 一起销毁。
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -P "$CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          # 让 codesign 不弹交互授权。
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" > /dev/null

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          uuid="$(grep -aA1 UUID "$profile_path" \
            | grep -o '[0-9A-Fa-f-]\{36\}' | head -1)"
          cp "$profile_path" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          rm -f "$cert_path" "$profile_path"

      - name: Build signed IPA
        if: ${{ inputs.signed }}
        working-directory: simple_live_app
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [[ -z "$TEAM_ID" ]]; then
            echo "签名构建缺少 secret：IOS_TEAM_ID" >&2
            exit 1
          fi
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST
          flutter build ipa --release \
            --export-options-plist=ExportOptions.plist

      # ---------- 收尾 ----------

      - name: Stage artifact
        id: artifact
        shell: bash
        env:
          APP_VERSION: ${{ steps.appver.outputs.version }}
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          SIGNED: ${{ inputs.signed }}
        run: |
          out="$RUNNER_TEMP/ios-artifact"
          mkdir -p "$out"
          short_sha="${GITHUB_SHA:0:8}"

          if [[ "$SIGNED" == "true" ]]; then
            src="$(find simple_live_app/build/ios/ipa -name '*.ipa' | head -1)"
            suffix="signed"
          else
            src="simple_live_app/build/ios/iphoneos/app-unsigned.ipa"
            suffix="unsigned"
          fi

          if [[ ! -f "$src" ]]; then
            echo "找不到构建产物：$src" >&2
            exit 1
          fi

          target="$out/dart_simple_live-${APP_VERSION}-ios-${suffix}-${short_sha}.ipa"
          cp "$src" "$target"
          sha="$(shasum -a 256 "$target" | cut -d' ' -f1)"
          size="$(du -h "$target" | cut -f1)"

          echo "dir=$out" >> "$GITHUB_OUTPUT"
          {
            echo "### iOS IPA (${suffix})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 版本 | ${APP_VERSION} |"
            echo "| Flutter | ${FLUTTER_VERSION} |"
            echo "| 提交 | \`${short_sha}\` |"
            echo "| 大小 | ${size} |"
            echo "| SHA-256 | \`${sha}\` |"
            if [[ "$suffix" == "unsigned" ]]; then
              echo ""
              echo "未签名产物，需用 AltStore / Sideloadly 侧载。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: dart-simple-live-ios-${{ github.sha }}
          path: ${{ steps.artifact.outputs.dir }}/*.ipa
          if-no-files-found: error
          retention-days: 14

      # GitHub artifact 下载永远是 zip 打包；需要"直接拿到 .ipa"时，
      # 发布到 Release 附件（附件不套 zip）。
      - name: Publish release with .ipa
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ios-${{ steps.appver.outputs.version }}-${{ inputs.signed && 'signed' || 'unsigned' }}
          name: Simple Live iOS ${{ steps.appver.outputs.version }} (${{ inputs.signed && '签名' || '未签名' }})
          body: |
            iOS IPA 构建产物（${{ inputs.signed && '已签名' || '未签名，需 AltStore / Sideloadly 侧载' }}）。

            - 版本：${{ steps.appver.outputs.version }}
            - 提交：`${{ github.sha }}`
            - 下载附件 `*.ipa` 即为可直接安装的包（Release 附件不打包 zip）。
          files: ${{ steps.artifact.outputs.dir }}/*.ipa
          allowUpdates: true
          prerelease: true

      - name: Clean up keychain
        if: ${{ always() && inputs.signed }}
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" || true
