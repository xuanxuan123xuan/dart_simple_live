[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'arm64-v8a'
endian = 'little'

[binaries]
c = '/sdk/linux/native/llvm/bin/clang'
cpp = '/sdk/linux/native/llvm/bin/clang++'
ar = '/sdk/linux/native/llvm/bin/llvm-ar'
strip = '/sdk/linux/native/llvm/bin/llvm-strip'
c_ld = '/sdk/linux/native/llvm/bin/ld.lld'
cpp_ld = '/sdk/linux/native/llvm/bin/ld.lld'
pkg-config = 'pkg-config'

[built-in options]
# -ffunction-sections / -fdata-sections：让 mpv 链接期的 --gc-sections 能按函数回收。
# 不加时对纯 C 依赖只能按整个 .o 回收，而链接器本就只按需从静态库拉 .o，等于没有收益；
# 上一轮实测的 3.74 MiB 主要来自 C++ 的 COMDAT 段。shaderc 走 CMake，
# OHOS 工具链文件已默认带这两个 flag，无需另行处理。
c_args = ['--target=aarch64-linux-ohos', '--sysroot=/sdk/linux/native/sysroot', '-fPIC', '-D__MUSL__=1', '-Wno-int-conversion', '-ffunction-sections', '-fdata-sections']
cpp_args = ['--target=aarch64-linux-ohos', '--sysroot=/sdk/linux/native/sysroot', '-fPIC', '-D__MUSL__=1', '-Wno-int-conversion', '-ffunction-sections', '-fdata-sections']
c_link_args = ['--target=aarch64-linux-ohos', '-fuse-ld=lld', '-lc++_shared']
cpp_link_args = ['--target=aarch64-linux-ohos', '-fuse-ld=lld', '-lc++_shared']
buildtype = 'release'
# meson 的 b_ndebug 默认 false，release 不会自动定义 NDEBUG，assert 全是活的
# （BUILD-NOTES §5 陷阱 6）。开启后同时去掉 .rodata 里的 __FILE__ 字符串。
b_ndebug = 'true'
# 未启用 ThinLTO：已实测且为净亏损，勿再重复尝试。
# 全链路 ThinLTO（crossfile b_lto + env.sh -flto=thin + ffmpeg --enable-lto +
# shaderc IPO）实测 15.62 → 16.52 MiB，gzip 6.73 → 7.06 MiB。
# 死代码消除确实发生了（.eh_frame −38888、.bss −63344），但 -O3 下的跨模块内联
# 让 .text 涨了 996140 字节，净亏 0.90 MiB。详见 docs/session/session-2026-08-11.md。
default_library = 'static'
wrap_mode = 'nodownload'
