name: SimpleLiveTVOS
options:
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.xuanxuan.simplelive.tvos
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: 3
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
packages:
  SimpleLiveTVOSCore:
    path: ../simple_live_tvos_core
  KSPlayer:
    path: build/vendor/KSPlayer
targets:
  SimpleLiveTVOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources/Signers
        buildPhase: resources
      - path: Resources/BrandAssets.xcassets
    settings:
      INFOPLIST_FILE: Resources/Info.plist
    dependencies:
      - package: SimpleLiveTVOSCore
      - package: KSPlayer
  SimpleLiveTVOSTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.xuanxuan.simplelive.tvos.tests
    dependencies:
      - target: SimpleLiveTVOS
schemes:
  SimpleLiveTVOS:
    build:
      targets:
        SimpleLiveTVOS: all
    test:
      targets:
        - SimpleLiveTVOSTests
