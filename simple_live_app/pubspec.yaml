name: simple_live_app
version: 1.13.0+11300
publish_to: none
description: "Simple Live APP"
environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  simple_live_core:
    path: ../simple_live_core
  dart_quickjs:
    path: ../third_party/dart_quickjs_compat
  # 图标
  cupertino_icons: ^1.0.8
  remixicon: ^1.4.1 #Remix图标

  # 框架、工具
  get: ^4.7.3 #状态管理、路由管理、国际化
  dio: ^5.9.0 #网络请求
  hive: 2.2.3 #持久化存储
  hive_flutter: 1.1.0 #持久化存储
  logger: ^2.6.2 #日志
  intl: 0.20.2 # Flutter 3.41 SDK pin（flutter_localizations 要求 ^0.20.2）
  qr_flutter: ^4.1.0 #二维码生成
  dynamic_color: 1.6.8
  path: any
  collection: any
  udp: ^5.0.3 #UDP
  uuid: ^4.5.2 #UUID
  webdav_client: ^1.2.2 # WebDAV
  archive: 3.6.1
  crypto: ^3.0.7

  #Widget
  flutter_staggered_grid_view: ^0.7.0 #瀑布流/GridView
  flutter_easyrefresh: 2.2.2 #下拉刷新、上拉加载
  extended_image: 9.1.0 # Dart 3.4 compatible
  flutter_smart_dialog: ^4.9.8+9 #各种弹窗 Toast/Dialog/Popup
  sticky_headers: ^0.3.0+2 #吸顶
  lottie: 3.1.3
  canvas_danmaku: ^0.2.7
  # ns_danmaku: #弹幕
  #   git:
  #     url: https://github.com/xiaoyaocz/flutter_ns_danmaku.git
  #     tag: v0.0.9

  #系统交互
  package_info_plus: 8.3.1
  device_info_plus: 9.1.2 # OpenHarmony-SIG adapter baseline
  url_launcher: 6.3.0 # Dart 3.4 compatible
  url_launcher_ohos:
    path: third_party/url_launcher_ohos
  share_plus: 7.2.2 # Dart 3.4 compatible
  path_provider: any
  cross_file: 0.3.4+2 # Dart 3.4 compatible
  permission_handler: 11.3.1 # Dart 3.4 compatible
  image_gallery_saver_plus: 3.0.5 # Dart 3.4 compatible
  screen_brightness:
    path: third_party/screen_brightness
  screen_brightness_ohos:
    path: third_party/screen_brightness_ohos
  auto_orientation_v2: ^2.3.6 #屏幕方向
  wakelock_plus: 1.2.10 # Dart 3.4 compatible; OHOS calls are guarded. 1.3.0 改用
  # SPM 目录布局(ios/wakelock_plus/Sources/.../include)，1.2.10 是最后一个传统 ios/Classes 布局。
  file_picker:
    path: third_party/file_picker_ohos_compat
  window_manager: 0.4.3
  screen_retriever: ^0.2.0 #屏幕范围
  floating: ^6.0.0 #PIP画中画
  flutter_inappwebview: 6.0.0 # Dart 3.4 compatible
  webview_flutter:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: 8c2c12ca96fc295052d7e5ba2ebeed6286fd927e
      path: packages/webview_flutter/webview_flutter
  connectivity_plus: 5.0.2 # OpenHarmony-SIG adapter baseline
  qr_code_scanner_plus: ^2.0.14 #二维码扫描
  volume_controller: ^3.4.0 #音量控制

  # 网络相关
  shelf: 1.4.1
  shelf_router: ^1.1.4
  # 7.x requires AGP 8.12.1/Gradle 8.13；当前用 AGP 8.9.1/Gradle 8.12，故钉 6.x。
  network_info_plus: 6.1.4
  web_socket_channel: ^3.0.1 #远程同步WebSocket

  # 视频播放
  media_kit: ^1.2.2
  media_kit_video:
    path: third_party/media_kit_video
  media_kit_libs_video: ^1.0.7
  video_player:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: 8c2c12ca96fc295052d7e5ba2ebeed6286fd927e
      path: packages/video_player/video_player

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sherpa_onnx: ^1.13.2


dev_dependencies:
  flutter_lints: ^2.0.0
  build_runner: ^2.3.3
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

dependency_overrides:
  canvas_danmaku:
    path: ../third_party/canvas_danmaku
  # 本地 fork：原包缺 androidx.core 依赖，Android 构建 toUri 无法解析。
  screen_brightness_android:
    path: third_party/screen_brightness_android
  # 本地 fork：原插件 release 自跑 R8 导致 androidx.webkit 引用的
  # android.window.BackEvent（API 33）Missing class，改 minifyEnabled false。
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android
  # 本地 fork：compileSdk 31 提升到 34（低于 33 时 R8 可能缺 API 33 类）。
  dynamic_color:
    path: third_party/dynamic_color
  # volume_controller >= 3.4.2 与 screen_brightness_ios >= 2.1.3 使用
  # FlutterSceneLifeCycleDelegate / addSceneDelegate / registrar.viewController，
  # 这些 Scene Lifecycle API 需 Flutter 3.35+；本分支（dev）已是 3.41，
  # 可升到最新，暂保持 3.4.1 / 2.1.2 避免多余改动。
  volume_controller: 3.4.1
  screen_brightness_ios: 2.1.2
  path_provider:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: 8c2c12ca96fc295052d7e5ba2ebeed6286fd927e
      path: packages/path_provider/path_provider
  video_player_ohos:
    path: third_party/video_player_ohos
  webview_flutter_ohos:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: 8c2c12ca96fc295052d7e5ba2ebeed6286fd927e
      path: packages/webview_flutter/webview_flutter_ohos
  webview_flutter_platform_interface:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: 8c2c12ca96fc295052d7e5ba2ebeed6286fd927e
      path: packages/webview_flutter/webview_flutter_platform_interface
  webview_flutter_android:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: 8c2c12ca96fc295052d7e5ba2ebeed6286fd927e
      path: packages/webview_flutter/webview_flutter_android
  webview_flutter_wkwebview:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      ref: 8c2c12ca96fc295052d7e5ba2ebeed6286fd927e
      path: packages/webview_flutter/webview_flutter_wkwebview

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/statement.txt
    - assets/images/
    - assets/images/douyin_emoji/
    - assets/icons/
    - assets/lotties/
